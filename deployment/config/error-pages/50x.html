<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Service temporarily unavailable</title>
<style>
  body{font-family:Roboto,Segoe UI,Arial,sans-serif;background:#f4f6f8;color:#263238;
       display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
  .card{background:#fff;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.08);
        padding:48px 56px;max-width:520px;text-align:center}
  h1{font-size:1.5rem;margin:0 0 12px}
  p{margin:0 0 20px;line-height:1.5;color:#546e7a}
  .code{font-size:.85rem;color:#90a4ae}
</style>
</head>
<body>
  <div class="card">
    <h1>Service temporarily unavailable</h1>
    <p>The CHM application server is not responding right now.
       It may be restarting — please try again in a minute.</p>
    <p class="code">If the problem persists, contact the system administrator.</p>
  </div>
</body>
</html>
