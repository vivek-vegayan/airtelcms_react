# ============================================================================
# CHM Airtel Scheduler - Nginx site configuration (Linux, HTTP)
# Install as: /etc/nginx/conf.d/chm-airtel.conf
# (keep the distro's /etc/nginx/nginx.conf; this file only adds the site.
#  On Ubuntu with sites-enabled layout, place it in /etc/nginx/sites-available/
#  and symlink into /etc/nginx/sites-enabled/ instead.)
#
# Frontend build deployed to: /var/www/chm/airtelchmbeta
# Backend (Spring Boot) on:   127.0.0.1:1857
# ============================================================================

# Backend upstream (Spring Boot embedded Tomcat)
upstream chm_backend {
    server 127.0.0.1:1857;
    keepalive 16;
}

server {
    listen       80 default_server;
    server_name  _;

    root   /var/www/chm;          # dist/ deployed as /var/www/chm/airtelchmbeta
    index  index.html;

    # ---- Logging ----
    access_log /var/log/nginx/chm-access.log;
    error_log  /var/log/nginx/chm-error.log warn;

    # ---- Upload / proxy limits ----
    client_max_body_size  1024m;  # Excel uploads (employee sheets, CRQ attachments) + SFTP Management large files
    client_body_timeout   300s;
    send_timeout          300s;

    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;
    proxy_read_timeout    300s;   # backend triggers SSH/SFTP jobs that can be slow
    proxy_buffering       on;
    proxy_buffers         16 16k;
    proxy_buffer_size     32k;

    # ---- Gzip compression ----
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_vary         on;
    gzip_types
        text/plain text/css text/xml
        application/json application/javascript application/xml
        application/vnd.ms-fontobject font/ttf font/otf font/woff2
        image/svg+xml;

    # ---- Security headers (HTTP-appropriate; HSTS added only with HTTPS) ----
    server_tokens off;
    add_header X-Content-Type-Options nosniff        always;
    add_header X-Frame-Options        SAMEORIGIN     always;
    add_header Referrer-Policy        strict-origin-when-cross-origin always;
    add_header X-XSS-Protection       "1; mode=block" always;

    # ---- Custom error pages ----
    error_page 502 503 504 /error-pages/50x.html;
    location = /error-pages/50x.html {
        internal;
        root /var/www/chm;
    }

    # Convenience: send bare-domain visitors to the app
    location = / {
        return 302 /airtelchmbeta/;
    }

    # =====================================================================
    # React SPA  (Vite base "/airtelchmbeta/", BrowserRouter basename "airtelchmbeta")
    # =====================================================================

    # Vite emits content-hashed files under assets/ -> cache aggressively
    location /airtelchmbeta/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # index.html must never be cached (it references the hashed assets)
    location = /airtelchmbeta/index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # SPA routing: unknown paths fall back to index.html so deep links
    # (e.g. /airtelchmbeta/roster/xyz) survive a browser refresh.
    location /airtelchmbeta/ {
        try_files $uri $uri/ /airtelchmbeta/index.html;
    }

    # =====================================================================
    # Spring Boot API proxy
    # Frontend base URL is "/changemanagementnew" (see .env.production);
    # the prefix is stripped so the backend sees its native paths
    # (/auth/v1/signin, /users/..., etc.).
    # =====================================================================
    location /changemanagementnew/ {
        proxy_pass http://chm_backend/;    # trailing slash strips the prefix

        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Authorization     $http_authorization;
    }

    # Block accidental exposure of actuator through the main proxy path
    location /changemanagementnew/actuator/ {
        deny all;
    }
}
