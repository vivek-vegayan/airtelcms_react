# ============================================================================
# CHM Airtel Scheduler - HTTPS reference configuration (FUTURE / OPTIONAL)
# Do NOT install this while running the HTTP deployment. See HTTPS-MIGRATION.md.
#
# Linux path:  /etc/nginx/conf.d/chm-airtel.conf  (replaces the HTTP file)
# Windows:     merge the two `server` blocks into C:\nginx\conf\nginx.conf and
#              change certificate paths to e.g. C:/nginx/certs/...
# ============================================================================

upstream chm_backend {
    server 127.0.0.1:1857;
    keepalive 16;
}

# ---- HTTP -> HTTPS redirect ----
server {
    listen      80 default_server;
    server_name chm.example.com;            # <- your hostname

    # Keep ACME challenges reachable over HTTP for certbot renewals
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS site ----
server {
    listen      443 ssl;
    http2       on;
    server_name chm.example.com;            # <- your hostname

    # Certificate + key (Let's Encrypt paths shown; use corporate CA files if provided)
    ssl_certificate     /etc/letsencrypt/live/chm.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chm.example.com/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;

    root   /var/www/chm;
    index  index.html;

    access_log /var/log/nginx/chm-access.log;
    error_log  /var/log/nginx/chm-error.log warn;

    client_max_body_size  1024m;
    client_body_timeout   300s;
    send_timeout          300s;
    proxy_connect_timeout 10s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    gzip on; gzip_comp_level 5; gzip_min_length 1024; gzip_proxied any; gzip_vary on;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml font/ttf font/otf font/woff2 image/svg+xml;

    # Security headers - HSTS is safe to enable once HTTPS is confirmed working
    server_tokens off;
    add_header X-Content-Type-Options nosniff        always;
    add_header X-Frame-Options        SAMEORIGIN     always;
    add_header Referrer-Policy        strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    error_page 502 503 504 /error-pages/50x.html;
    location = /error-pages/50x.html { internal; root /var/www/chm; }

    location = / { return 302 /airtelchmbeta/; }

    location /airtelchmbeta/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /airtelchmbeta/index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    location /airtelchmbeta/ {
        try_files $uri $uri/ /airtelchmbeta/index.html;
    }

    location /changemanagementnew/ {
        proxy_pass http://chm_backend/;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # backend sees "https"
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Authorization     $http_authorization;
    }

    location /changemanagementnew/actuator/ { deny all; }
}
