# ============================================================================
# CHM Airtel Scheduler - Nginx configuration (Windows Server, HTTP)
# Install as: C:\nginx\conf\nginx.conf
# Frontend build deployed to: C:\vegayan\simplus\www\airtelchmbeta
# Backend (Spring Boot) on:   127.0.0.1:1857
# ============================================================================

# On Windows, nginx uses one worker by default; 2 is a sensible ceiling
# (Windows nginx is officially "beta" for high-concurrency use).
worker_processes  2;

error_log  logs/error.log warn;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # ---- Logging ----
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time urt=$upstream_response_time';
    access_log  logs/access.log  main;

    # ---- Performance ----
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 4096;

    # Hide nginx version in headers/error pages
    server_tokens off;

    # ---- Gzip compression ----
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_vary         on;
    gzip_types
        text/plain text/css text/xml
        application/json application/javascript application/xml
        application/vnd.ms-fontobject font/ttf font/otf font/woff2
        image/svg+xml;

    # ---- Upload / proxy limits ----
    client_max_body_size    1024m;    # Excel uploads (employee sheets, CRQ attachments) + SFTP Management large files
    client_body_timeout     300s;
    send_timeout            300s;

    proxy_connect_timeout   10s;
    proxy_send_timeout      120s;
    proxy_read_timeout      300s;     # backend triggers SSH/SFTP jobs that can be slow
    proxy_buffering         on;
    proxy_buffers           16 16k;
    proxy_buffer_size       32k;

    # Backend upstream (Spring Boot embedded Tomcat)
    upstream chm_backend {
        server 127.0.0.1:1857;
        keepalive 16;
    }

    server {
        listen       80;
        server_name  _;

        root   "C:/vegayan/simplus/www";     # dist/ deployed as .../www/airtelchmbeta
        index  index.html;

        # ---- Security headers (HTTP-appropriate; HSTS added only with HTTPS) ----
        add_header X-Content-Type-Options nosniff        always;
        add_header X-Frame-Options        SAMEORIGIN     always;
        add_header Referrer-Policy        strict-origin-when-cross-origin always;
        add_header X-XSS-Protection       "1; mode=block" always;

        # ---- Custom error pages ----
        error_page 502 503 504 /error-pages/50x.html;
        location = /error-pages/50x.html {
            internal;
            root "C:/vegayan/simplus/www";
        }

        # Convenience: send bare-domain visitors to the app
        location = / {
            return 302 /airtelchmbeta/;
        }

        # =====================================================================
        # React SPA  (Vite base "/airtelchmbeta/", BrowserRouter basename "airtelchmbeta")
        # =====================================================================

        # Vite emits content-hashed files under assets/ -> cache aggressively
        location /airtelchmbeta/assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
            try_files $uri =404;
        }

        # index.html must never be cached (it references the hashed assets)
        location = /airtelchmbeta/index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            expires -1;
        }

        # SPA routing: unknown paths fall back to index.html so deep links
        # (e.g. /airtelchmbeta/roster/xyz) survive a browser refresh.
        location /airtelchmbeta/ {
            try_files $uri $uri/ /airtelchmbeta/index.html;
        }

        # =====================================================================
        # Spring Boot API proxy
        # Frontend base URL is "/changemanagementnew" (see .env.production);
        # the prefix is stripped so the backend sees its native paths
        # (/auth/v1/signin, /users/..., etc.).
        # =====================================================================
        location /changemanagementnew/ {
            proxy_pass http://chm_backend/;    # trailing slash strips the prefix

            proxy_http_version 1.1;
            proxy_set_header Connection        "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header Authorization     $http_authorization;
        }

        # Block accidental exposure of actuator through the main proxy path
        location /changemanagementnew/actuator/ {
            deny all;
        }
    }
}
