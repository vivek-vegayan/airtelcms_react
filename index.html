<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- <link rel="icon" type="image/svg+xml" href="/vite.svg" /> -->
  <link rel="icon" type="image/svg+xml" href="src/assets/images/vsicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Change | Management</title>
  <style>
    /*
      Renders on first paint, before the JS bundle parses/executes, so a
      hard refresh never shows a blank white tab. #boot-splash sits as a
      sibling of #root (not inside it) so mounting React doesn't wipe it out
      from under itself - GlobalLoader removes it once it takes over.
    */
    #boot-splash {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0a1330 0%, #101c44 45%, #060a1c 100%);
      transition: opacity .35s ease;
    }
    @media (prefers-color-scheme: light) {
      #boot-splash { background: linear-gradient(135deg, #eef2fb 0%, #dbe6f7 100%); }
      #boot-splash .bs-word { color: #0a1b3d; }
      #boot-splash .bs-sub { color: #4a6187; }
    }
    #boot-splash.bs-hidden { opacity: 0; pointer-events: none; }
    /* Centers the mark, text, and progress bar as one column regardless of
       which is widest - without this, a plain block div left-aligns its
       narrower children (the mark) against its widest one (the text). */
    #boot-splash .bs-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: bs-riseIn .5s cubic-bezier(.22,1,.36,1) both;
    }
    #boot-splash .bs-mark {
      position: relative;
      width: 76px;
      height: 76px;
    }
    #boot-splash .bs-glow {
      position: absolute;
      inset: -22px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(37,99,235,.35), transparent 70%);
      filter: blur(10px);
    }
    #boot-splash .bs-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #2563eb, #ED1C24, #7c3aed, #2563eb);
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 4px));
      mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 4px));
      animation: bs-spin 1s linear infinite;
    }
    #boot-splash .bs-core {
      position: absolute;
      inset: 13px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #ffffff, #b9c8e8 70%);
      box-shadow: 0 0 22px rgba(37,99,235,.55);
      animation: bs-breathe 1.8s ease-in-out infinite;
    }
    #boot-splash .bs-text { margin-top: 24px; text-align: center; }
    #boot-splash .bs-word {
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: .04em;
      color: #f4f6ff;
    }
    #boot-splash .bs-sub {
      margin-top: 4px;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 11px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: #7f8db8;
    }
    #boot-splash .bs-track {
      position: relative;
      margin-top: 20px;
      width: 120px;
      height: 3px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255,255,255,.1);
    }
    #boot-splash .bs-fill {
      position: absolute;
      top: 0; left: 0;
      height: 100%;
      width: 40%;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, #2563eb, #ED1C24, transparent);
      animation: bs-slide 1.6s ease-in-out infinite;
    }
    @keyframes bs-spin { to { transform: rotate(360deg); } }
    @keyframes bs-breathe {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(.88); opacity: .85; }
    }
    @keyframes bs-riseIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes bs-slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(220%); }
    }
  </style>
</head>

<body style="overflow: hidden">
  <div id="boot-splash" aria-hidden="true">
    <div class="bs-content">
      <div class="bs-mark">
        <div class="bs-glow"></div>
        <div class="bs-ring"></div>
        <div class="bs-core"></div>
      </div>
      <div class="bs-text">
        <div class="bs-word">AIRTEL CHM</div>
        <div class="bs-sub">Loading workspace</div>
      </div>
      <div class="bs-track">
        <div class="bs-fill"></div>
      </div>
    </div>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
